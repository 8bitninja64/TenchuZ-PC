# Builds the runtime (no game code: the game module is compiled from each player's own disc on
# its first start) and packages it; tags v* publish the zip as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The version the F1 menu's updater compares with the latest release: the tag for releases.
env:
  TENCHU_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The generator (XenonRecomp, pinned and patched), prebuilt FFmpeg, SDL3, Dear ImGui and
      # the runtime; no disc, so no game module.
      - name: Build runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build.ps1 -SkipRecomp -Target TenchuZ
      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1 -Zip
      - uses: actions/upload-artifact@v5
        with:
          name: TenchuZ-windows-x64
          path: dist/TenchuZ-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenchuZ-windows-x64.zip
