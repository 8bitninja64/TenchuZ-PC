# Builds the runtime (no game code: the game module is compiled from each player's own disc on
# its first start) and packages it for Windows and Linux; tags v* publish both as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The version the F1 menu's updater compares with the latest release: the tag for releases.
env:
  TENCHU_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The generator (XenonRecomp, pinned and patched), prebuilt FFmpeg, SDL3, Dear ImGui and
      # the runtime; no disc, so no game module.
      - name: Build runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build.ps1 -SkipRecomp -Target TenchuZ
      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1 -Zip
      - uses: actions/upload-artifact@v5
        with:
          name: TenchuZ-windows-x64
          path: dist/TenchuZ-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenchuZ-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The build directory is cached (the generator, vkd3d, SDL3, DXVK and FFmpeg builds): keyed
      # on the recipes and pinned sources, so a new cache is made only when those change; any
      # older one is a starting point (ninja rebuilds what changed).
      - name: Restore the build directory
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-release
          key: linux-release-${{ hashFiles('tools/build_linux_release.sh', 'tools/install_linux_deps.sh', 'tools/setup_linux_deps.sh', 'tools/build_xma_codec.py', 'tools/setup_generator.py', 'tools/patches/*') }}
          restore-keys: linux-release-
      # In Ubuntu 22.04 (glibc 2.35), so that the release runs on Ubuntu 22.04 / Mint 21 /
      # Debian 12 / SteamOS and newer (tools/build_linux_release.sh).
      - name: Build runtime (Ubuntu 22.04 container)
        run: |
          mkdir -p build/linux-release
          docker run --rm -e TENCHU_VERSION -v "$PWD:/src" -v "$PWD/build/linux-release:/build" ubuntu:22.04 \
            sh /src/tools/build_linux_release.sh /src /build
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Save the build directory
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: build/linux-release
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Zig (the first-start compiler the package carries)
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c
          mkdir -p "$HOME/zig" && tar -C "$HOME/zig" -xJf zig.tar.xz && rm zig.tar.xz
      - name: Package
        run: TENCHU_MAX_GLIBC=2.35 sh tools/package_linux.sh build/linux-release
      - uses: actions/upload-artifact@v5
        with:
          name: TenchuZ-linux-x64
          path: dist/TenchuZ-linux-x64.tar.xz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenchuZ-linux-x64.tar.xz
