registers = ["f1"]

# HUD panel slide countdown (sub_8238BA98)
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x8238BB3C
registers = ["f13"]

# HUD notification popup lifetime (sub_8238BD18)
