# HUD indicator (sub_822BE208): counters in ticks; latched fade rates and the hold below
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822BE348
registers = ["f0"]

[[midasm_hook]]
name = "IndicatorFadeInRateMidAsmHook"
address = 0x822BE364
