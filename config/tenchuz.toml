# Tenchu Z (USA, Europe) default.xex, XDK 2.0.4552.
# Correctness profile, matching the Darkness port: preserve the full guest
# register state across calls; guest ABI shortcuts are disabled.
[main]
file_path = "../game/default.xex"
switch_table_file_path = "tenchuz_switch_tables.toml"
skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = false
# Compiler register save/restore helpers (tools/find_abi_helpers.py).
savegprlr_14_address = 0x82653F10
restgprlr_14_address = 0x82653F60
savefpr_14_address = 0x82654720
restfpr_14_address = 0x8265476C
savevmx_14_address = 0x826547C0
restvmx_14_address = 0x82654A58
savevmx_64_address = 0x82654854
restvmx_64_address = 0x82654AEC
# C runtime setjmp/longjmp, translated to host setjmp/longjmp at call sites.
# The guest jmp_buf (over 300 bytes) holds the 256-byte host jmp_buf.
setjmp_address = 0x82657B00
longjmp_address = 0x826578C0

# Frame time: 0x82B57824 holds milliseconds per frame (sub_822929D0). Effect code turns
# it into whole 30 Hz ticks with int(ms * 0.03 + 0.5) (0 at 120 fps: water ripples never
# expired) or into whole milliseconds with int(ms). FrameTicks30MidAsmHook replaces the
# tick sites' value at their fctiwz with a carried tick count; QuantizedFrameStepMidAsmHook
# gives the millisecond sites a whole number of ms whose sum follows the real time
# (runtime/kernel/native_overrides.cpp).
[[midasm_hook]]
name = "QuantizedFrameStepMidAsmHook"
address = 0x82380638
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x82385AFC
registers = ["f0"]

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x82388424
registers = ["f0"]

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x82388484
registers = ["f0"]

[[midasm_hook]]
name = "QuantizedFrameStepMidAsmHook"
address = 0x8238AC0C
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x8238AE74
registers = ["f0"]

[[midasm_hook]]
name = "QuantizedFrameStepMidAsmHook"
address = 0x823E2254
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x82298924
registers = ["f0"]

# Frame-time truncation sites found by the audit (int(ms * 0.03 + 0.5) is 0 at 120 fps).
# object state countdown 0x82B63D40 (sub_822C2390)
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822C2488
registers = ["f0"]

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822C2728
registers = ["f0"]

# object type 0x2000B state waits (sub_822C27D8)
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822C2884
registers = ["f0"]

[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822C29E0
registers = ["f0"]

# object state wait (sub_822C5C40)
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x822C5F2C
registers = ["f0"]

# effect particle integrator steps (sub_82380520, before floor())
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
address = 0x82380584
registers = ["f1"]

# effect particle steps (sub_8237B248, before floor())
[[midasm_hook]]
name = "FrameTicks30MidAsmHook"
