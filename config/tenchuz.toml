# Wave water phase step, per frame (sub_823C30E8): scaled to the frame time
[[midasm_hook]]
name = "WavePhaseStepMidAsmHook"
address = 0x823C33B0
registers = ["f0"]

# Cheats (runtime/kernel/cheats.cpp): the grapple's ray length after its load in
# sub_82363860 (the constant is shared with AI sight), and the fall height above which the
# player staggers on landing (player fall state and state 160; shared constant).
[[midasm_hook]]
name = "GrappleRayLengthMidAsmHook"
address = 0x82363914
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "SoftLandingMidAsmHook"
address = 0x823618BC
registers = ["f13"]
